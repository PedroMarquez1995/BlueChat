
name: Compilar BlueChat APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener los archivos
        uses: actions/checkout@v4

      - name: Localizar o extraer BlueChat
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle.kts ]]; then
            echo 'BLUECHAT_SOURCE=.' >> "$GITHUB_ENV"
            echo 'Proyecto Android detectado en la raiz.'
          else
            ARCHIVO_ZIP=''
            for candidato in 'BlueChat-2.0-Redesign.zip' 'BlueChat-Android-Project.zip'; do
              if [[ -f "$candidato" ]]; then
                ARCHIVO_ZIP="$candidato"
                break
              fi
            done
            if [[ -z "$ARCHIVO_ZIP" ]]; then
              echo 'ERROR: No se encontro un proyecto Android ni un ZIP compatible en la raiz.' >&2
              echo 'Archivos encontrados:' >&2
              ls -la >&2
              exit 1
            fi
            echo "Extrayendo: $ARCHIVO_ZIP"
            mkdir -p _bluechat_source
            unzip -q "$ARCHIVO_ZIP" -d _bluechat_source
            PROJECT_FILE="$(find _bluechat_source -type f -name settings.gradle.kts -print -quit)"
            if [[ -z "$PROJECT_FILE" ]]; then
              echo 'ERROR: El ZIP no contiene settings.gradle.kts.' >&2
              exit 1
            fi
            PROJECT_DIR="$(dirname "$PROJECT_FILE")"
            echo "BLUECHAT_SOURCE=$PROJECT_DIR" >> "$GITHUB_ENV"
            echo "Proyecto encontrado en: $PROJECT_DIR"
          fi

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Instalar Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Preparar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Probar y compilar APK
        shell: bash
        run: |
          set -uo pipefail
          cd "$BLUECHAT_SOURCE"
          LOG="$RUNNER_TEMP/bluechat-gradle.log"
          set +e
          gradle --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug > "$LOG" 2>&1
          RESULTADO=$?
          set -e
          if [[ "$RESULTADO" -eq 0 ]]; then
            echo 'Compilación correcta.'
            tail -n 35 "$LOG"
          else
            echo '============================================='
            echo 'ERROR REAL DEL COMPILADOR DE BLUECHAT'
            echo '============================================='
            REGEX='(^e: |^error:|\.kt:[0-9]+:[0-9]+|^> Task .*FAILED|^FAILURE:|^\* What went wrong:|^Execution failed for task|Could not resolve|Could not find|Unresolved reference|A failure occurred)'
            grep -nE "$REGEX" "$LOG" | head -n 50 || true
            echo '============================================='
            echo 'Últimas 35 líneas del registro:'
            tail -n 35 "$LOG"
            echo '### BlueChat: errores de compilación' >> "$GITHUB_STEP_SUMMARY"
            echo 'Busca estas líneas en el registro (puedes hacer una captura):' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -nE "$REGEX" "$LOG" | head -n 50 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo 'También se publicará el registro completo como BlueChat-Gradle-ERROR.' >> "$GITHUB_STEP_SUMMARY"
            exit "$RESULTADO"
          fi

      - name: Guardar registro de errores
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BlueChat-Gradle-ERROR
          path: ${{ runner.temp }}/bluechat-gradle.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verificar APK
        shell: bash
        run: test -s "$BLUECHAT_SOURCE/app/build/outputs/apk/debug/app-debug.apk"

      - name: Publicar BlueChat
        uses: actions/upload-artifact@v4
        with:
          name: BlueChat-Debug-APK
          path: ${{ env.BLUECHAT_SOURCE }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
