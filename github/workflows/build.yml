
name: Compilar BlueChat APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener los archivos
        uses: actions/checkout@v4
      - name: Localizar o extraer BlueChat
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle.kts ]]; then
            echo 'BLUECHAT_SOURCE=.' >> "$GITHUB_ENV"
          elif [[ -f BlueChat-Android-Project.zip ]]; then
            mkdir -p _bluechat_source
            unzip -q BlueChat-Android-Project.zip -d _bluechat_source
            if [[ -f _bluechat_source/BlueChat-Android-Project/settings.gradle.kts ]]; then
              echo 'BLUECHAT_SOURCE=_bluechat_source/BlueChat-Android-Project' >> "$GITHUB_ENV"
            else
              echo 'No se encontró settings.gradle.kts dentro del ZIP' >&2
              exit 1
            fi
          else
            echo 'Sube los archivos descomprimidos o BlueChat-Android-Project.zip' >&2
            exit 1
          fi
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Probar y compilar APK
        shell: bash
        run: |
          cd "$BLUECHAT_SOURCE"
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verificar APK
        run: test -s "$BLUECHAT_SOURCE/app/build/outputs/apk/debug/app-debug.apk"
      - name: Publicar BlueChat
        uses: actions/upload-artifact@v4
        with:
          name: BlueChat-Debug-APK
          path: ${{ env.BLUECHAT_SOURCE }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
